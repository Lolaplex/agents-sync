name: Release & Publish

on:
  push:
    tags:
      - 'v*.*.*'
  release:
    types: [published]

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build, Release & Publish
    runs-on: ubuntu-latest
    permissions:
      contents: write       # For GitHub Release creation
      id-token: write       # For PyPI Trusted Publishing

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install build & packaging tools
        run: |
          python -m pip install --upgrade pip
          pip install build twine

      - name: Build source and binary distribution
        run: python -m build

      - name: Validate distribution metadata
        run: twine check dist/*

      - name: Create or Update GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          generate_release_notes: true
          draft: false
          prerelease: false

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

      - name: Notify Release Published
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.RELEASE_WEBHOOK_URL }}
        run: |
          if [ -z "$WEBHOOK_URL" ]; then
            echo "::warning::RELEASE_WEBHOOK_URL unset; skip notification"
            exit 0
          fi
          PAYLOAD=$(python3 <<'PY'
          import os, json, re
          tag = os.environ.get('GITHUB_REF_NAME', '')
          repo = os.environ.get('GITHUB_REPOSITORY', '')
          server = os.environ.get('GITHUB_SERVER_URL', 'https://github.com')
          repo_url = f'{server}/{repo}'
          release_url = f"{repo_url}/releases/tag/{tag}"
          pypi_url = f"https://pypi.org/project/{repo.split('/')[-1]}/{tag.lstrip('v')}/"

          notes = 'Lockstep release published successfully.'
          try:
              with open('CHANGELOG.md') as f:
                  content = f.read()
              version = tag.lstrip('v')
              match = re.search(rf'## \[{re.escape(version)}\][^\n]*\n(.*?)(?=\n## |\Z)', content, re.DOTALL)
              if match:
                  notes = match.group(1).strip()[:1800]
          except Exception:
              pass

          print(json.dumps({
              'embeds': [{
                  'title': f'🚀 Release {tag} Published! — {repo}',
                  'url': release_url,
                  'description': f'**{repo}** is live on PyPI and GitHub Releases.\n\n{notes}\n\n[GitHub Release]({release_url}) · [PyPI]({pypi_url}) · [Repository]({repo_url})',
                  'color': 5763719
              }]
          }))
          PY
          )
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$WEBHOOK_URL"

      - name: Notify Release Failure
        if: failure()
        env:
          CI_WEBHOOK_URL: ${{ secrets.CI_WEBHOOK_URL }}
        run: |
          if [ -z "$CI_WEBHOOK_URL" ]; then
            echo "::warning::CI_WEBHOOK_URL unset; skip notification"
            exit 0
          fi
          PAYLOAD=$(python3 -c "import json, os; repo=os.environ['GITHUB_REPOSITORY']; server=os.environ['GITHUB_SERVER_URL']; repo_url=f'{server}/{repo}'; ref=os.environ.get('GITHUB_REF_NAME', ''); run_url=f'{server}/{repo}/actions/runs/{os.environ[\"GITHUB_RUN_ID\"]}'; print(json.dumps({'embeds':[{'title':f'🔴 Release Failure: {repo}','url':run_url,'description':f\"Failed to publish \`{ref}\`\\n[View run]({run_url}) · [Repository]({repo_url})\",'color':15158332}]}))")
          curl -fsS -X POST -H 'Content-Type: application/json' -d "$PAYLOAD" "$CI_WEBHOOK_URL"
